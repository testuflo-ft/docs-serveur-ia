name: OpenAI Writer Bot (Gratuit)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Que voulez-vous que l'IA écrive ou modifie ?"
        required: true
        default: "Ajoute une section FAQ à mon fichier README.md"
      file_path:
        description: "Chemin du fichier à modifier (ex: README.md)"
        required: true
        default: "README.md"

permissions:
  contents: write

jobs:
  write-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenAI Library
        run: pip install openai

      - name: Ask ChatGPT via GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_PROMPT: ${{ github.event.inputs.prompt }}
          FILE_PATH: ${{ github.event.inputs.file_path }}
        run: |
          python -c "
          import os
          import sys
          from openai import OpenAI

          try:
              client = OpenAI(
                  base_url='https://azure.com',
                  api_key=os.environ['GITHUB_TOKEN']
              )
              
              file_path = os.environ['FILE_PATH']
              user_prompt = os.environ['USER_PROMPT']

              current_content = ''
              if os.path.exists(file_path):
                  with open(file_path, 'r', encoding='utf-8') as f:
                      current_content = f.read()

              system_instruction = (
                  'Tu es un developpeur qui modifie ou cree des fichiers de code ou de documentation. '
                  'Renvoie uniquement le contenu final brut du fichier. '
                  'Ne mets aucun bloc de code markdown, pas de balises avec trois backticks au debut ou a la fin, et aucun commentaire annexe.'
              )

              prompt_content = f'Contenu actuel du fichier:\n\n{current_content}\n\nInstruction de modification:\n{user_prompt}'

              response = client.chat.completions.create(
                  model='gpt-4o',
                  messages=[
                      {'role': 'system', 'content': system_instruction},
                      {'role': 'user', 'content': prompt_content}
                  ]
              )

              # Vérification du type de réponse reçu pour éviter le crash
              if hasattr(response, 'choices'):
                  new_content = response.choices[0].message.content.strip()
                  with open(file_path, 'w', encoding='utf-8') as f:
                      f.write(new_content)
              else:
                  print('--- ERREUR SERVEUR GITHUB MODELS ---')
                  print('Le serveur a renvoyé un texte inattendu au lieu d un objet :')
                  print(response)
                  sys.exit(1)

          except Exception as e:
              print('--- ERREUR SYSTEME ---')
              print(e)
              sys.exit(1)
          "

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add "${{ github.event.inputs.file_path }}"
          git commit -m "Mise à jour automatique par ChatGPT (GitHub Models)" || echo "Aucune modification détectée"
          git push
